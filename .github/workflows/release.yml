name: GitHub Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify tag matches package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          module = pathlib.Path("src/jenkins_mcp_server/__init__.py").read_text()
          expected = f'__version__ = "{version}"'
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Git tag does not match pyproject.toml version")
          if expected not in module:
              raise SystemExit("Package __version__ does not match pyproject.toml")
          PY

      - name: Install verification and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,release]'

      - name: Lint
        run: ruff check

      - name: Compile
        run: python -m compileall src

      - name: Test with coverage
        run: python -m pytest

      - name: Build and verify distributions
        run: python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
